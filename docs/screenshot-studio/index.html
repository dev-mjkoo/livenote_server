<body>
  <header class="topbar"><div class="brand"><h1>Screenshot Template Studio</h1><p>언어마다 동일한 화면 세트를 만들고 필요한 장만 PNG로 저장하세요.</p></div><div class="top-actions"><select id="size"><option value="1290x2796">1290 × 2796 · 6.7형</option><option value="1320x2868">1320 × 2868 · 6.9형</option><option value="1242x2688">1242 × 2688 · 6.5형</option><option value="1179x2556">1179 × 2556 · 6.1형</option></select><button id="save-project">프로젝트 저장</button><button id="add-language">언어 추가</button><button id="add">화면 추가</button><button id="export-all" class="primary">전체 PNG 저장</button></div></header>
  <div class="app"><aside id="inspector" class="inspector"></aside><main class="workspace"><div class="workspace-head"><span id="count"></span><span>화면을 선택하면 왼쪽에서 편집할 수 있습니다.</span></div><section id="artboards" class="artboards"></section></main></div><div id="toast" class="toast"></div><div id="language-dialog" class="dialog-backdrop" role="dialog" aria-modal="true" aria-labelledby="language-dialog-title"><form id="language-form" class="dialog"><h2 id="language-dialog-title">언어 추가</h2><p>현재 화면 세트를 그대로 복제해 아래쪽에 새 언어 행을 만듭니다.</p><label>언어 또는 국가 이름<input id="language-name" type="text" autocomplete="off"></label><div class="button-row"><button id="cancel-language" type="button">취소</button><button class="primary" type="submit">복제해서 추가</button></div></form></div>
  <script>
    const BW=1290,BH=2796,MAX=10,KEY='screenshot-template-studio-v1',cache=new Map();
    const make=(o={})=>({id:crypto.randomUUID(),name:'새 화면',imageSrc:'',bgImageSrc:'',logoSrc:'',logoScale:.14,logoX:90,logoY:90,eyebrow:'',title:'여기에 문구를\\n입력하세요.',preset:'signature',background:'diagonal',colorA:'#0875ff',colorB:'#56a5ff',colorC:'#8b5cf6',textColor:'#ffffff',fontSize:104,fontWeight:800,textY:155,align:'left',imageScale:.9,imageY:560,frame:true,dynamicIsland:true,deviceColor:'black',...o});

    const designPresets=[
      {id:'signature',name:'시그니처 블루',desc:'선명하고 기본에 충실',preview:'linear-gradient(135deg,#0875ff 0 58%,#56a5ff 58%)',ink:'#fff',values:{background:'diagonal',colorA:'#0875ff',colorB:'#56a5ff',colorC:'#8b5cf6',textColor:'#ffffff',fontSize:104,fontWeight:800,textY:155,align:'left',imageScale:.88,imageY:650,deviceColor:'black'}},
      {id:'minimal',name:'미니멀 페이퍼',desc:'여백이 넓은 밝은 톤',preview:'linear-gradient(145deg,#f7f4ed,#ddd8cb)',ink:'#171717',values:{background:'solid',colorA:'#f5f2ea',colorB:'#ded8ca',colorC:'#c9bda7',textColor:'#151515',fontSize:100,fontWeight:700,textY:170,align:'left',imageScale:.82,imageY:790,deviceColor:'natural'}},

      {id:'lavender',name:'소프트 라벤더',desc:'차분한 파스텔 그라디언트',preview:'linear-gradient(145deg,#6550e8,#b69fff 58%,#ff9ecf)',ink:'#fff',values:{background:'gradient',colorA:'#6550e8',colorB:'#ae98ff',colorC:'#ff92c8',textColor:'#ffffff',fontSize:102,fontWeight:700,textY:175,align:'left',imageScale:.87,imageY:720,deviceColor:'white'}},

      {id:'split',name:'볼드 스플릿',desc:'컬러 블록으로 강한 대비',preview:'linear-gradient(120deg,#f1eadf 0 52%,#ff6b35 52% 77%,#0875ff 77%)',ink:'#111',values:{background:'split',colorA:'#f2ede5',colorB:'#ff6b35',colorC:'#0875ff',textColor:'#111111',fontSize:112,fontWeight:900,textY:150,align:'left',imageScale:.86,imageY:760,deviceColor:'black'}},
      {id:'mint',name:'민트 그리드',desc:'깔끔한 생산성 앱 무드',preview:'linear-gradient(rgba(255,255,255,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.14) 1px,transparent 1px),#087c68',ink:'#fff',values:{background:'grid',colorA:'#087c68',colorB:'#6ee7c2',colorC:'#d9fff4',textColor:'#ffffff',fontSize:102,fontWeight:800,textY:165,align:'left',imageScale:.88,imageY:715,deviceColor:'natural'}},
      {id:'sunset',name:'선셋 메시',desc:'따뜻하고 활기찬 컬러',preview:'radial-gradient(circle at 20% 10%,#ffd36c,transparent 45%),linear-gradient(135deg,#ff5a45,#8b5cf6)',ink:'#fff',values:{background:'mesh',colorA:'#ff5a45',colorB:'#ffbf59',colorC:'#8b5cf6',textColor:'#ffffff',fontSize:108,fontWeight:800,textY:155,align:'left',imageScale:.88,imageY:720,deviceColor:'natural'}},
      {id:'rings',name:'모던 링',desc:'절제된 그래픽 포인트',preview:'radial-gradient(circle at 100% 15%,transparent 0 20%,#ddb76f 21% 24%,transparent 25% 34%,#c9a45d 35% 38%,transparent 39%),#f1eadc',ink:'#1a1a1a',values:{background:'rings',colorA:'#f3eee5',colorB:'#d3ab65',colorC:'#1b2233',textColor:'#171717',fontSize:102,fontWeight:800,textY:180,align:'left',imageScale:.82,imageY:810,deviceColor:'white'}},
      {id:'wave',name:'코발트 웨이브',desc:'리듬감 있는 레이어',preview:'linear-gradient(150deg,#0b36a8,#176fff 55%,#59c4ff)',ink:'#fff',values:{background:'waves',colorA:'#0b36a8',colorB:'#176fff',colorC:'#59c4ff',textColor:'#ffffff',fontSize:106,fontWeight:800,textY:155,align:'left',imageScale:.9,imageY:720,deviceColor:'blue'}},
      {id:'stripe',name:'뉴트럴 스트라이프',desc:'세련된 브랜드 캠페인',preview:'repeating-linear-gradient(115deg,#24262d 0 22px,#555b67 22px 36px,#181a20 36px 58px)',ink:'#fff',values:{background:'stripes',colorA:'#181a20',colorB:'#717988',colorC:'#d7dde8',textColor:'#ffffff',fontSize:110,fontWeight:800,textY:170,align:'left',imageScale:.84,imageY:790,deviceColor:'black'}}
    ];
    let screens=structuredClone(initial),selected=0,groups=[{id:crypto.randomUUID(),name:'한국어',screenIds:screens.map(s=>s.id)}];
    const $=s=>document.querySelector(s),inspector=$('#inspector'),boards=$('#artboards'),size=$('#size'),toast=$('#toast'),languageDialog=$('#language-dialog'),languageName=$('#language-name');
    const esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
    function notify(msg,t=2600){toast.textContent=msg;toast.classList.add('show');clearTimeout(notify.t);notify.t=setTimeout(()=>toast.classList.remove('show'),t)}
    function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
    function rgba(hex,a){let v=hex.replace('#','');if(v.length===3)v=[...v].map(x=>x+x).join('');let n=parseInt(v,16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`}
    function hexToHsl(hex){let v=String(hex).trim().replace('#','');if(v.length===3)v=[...v].map(x=>x+x).join('');if(!/^[0-9a-f]{6}$/i.test(v))return[214,100,52];let r=parseInt(v.slice(0,2),16)/255,g=parseInt(v.slice(2,4),16)/255,b=parseInt(v.slice(4,6),16)/255,max=Math.max(r,g,b),min=Math.min(r,g,b),h=0,s=0,l=(max+min)/2,d=max-min;if(d){s=d/(1-Math.abs(2*l-1));if(max===r)h=60*(((g-b)/d)%6);else if(max===g)h=60*((b-r)/d+2);else h=60*((r-g)/d+4)}return[(h+360)%360,s*100,l*100]}
    function hslToHex(h,s,l){h=(h%360+360)%360;s=Math.max(0,Math.min(100,s))/100;l=Math.max(0,Math.min(100,l))/100;let c=(1-Math.abs(2*l-1))*s,x=c*(1-Math.abs((h/60)%2-1)),m=l-c/2,r=0,g=0,b=0;if(h<60)[r,g,b]=[c,x,0];else if(h<120)[r,g,b]=[x,c,0];else if(h<180)[r,g,b]=[0,c,x];else if(h<240)[r,g,b]=[0,x,c];else if(h<300)[r,g,b]=[x,0,c];else[r,g,b]=[c,0,x];return'#'+[r,g,b].map(v=>Math.round((v+m)*255).toString(16).padStart(2,'0')).join('')}
    function recommendColors(){let current=screens[selected];if(!current)return;let[h,s,l]=hexToHsl(current.colorA),schemes=[{name:'유사색',hues:[h+28,h-34],sat:[s*.92,s*.8],light:[l+10,l-12]},{name:'보색',hues:[h+180,h+32],sat:[s*.82,s*.9],light:[l+8,l-10]},{name:'분할 보색',hues:[h+150,h+210],sat:[s*.88,s*.82],light:[l+7,l-8]},{name:'삼각 배색',hues:[h+120,h+240],sat:[s*.8,s*.86],light:[l+9,l-7]},{name:'단색 계열',hues:[h+5,h-5],sat:[s*.62,s*.95],light:[l+22,l-20]},{name:'소프트 대비',hues:[h+55,h+195],sat:[s*.55,s*.72],light:[l+18,l+5]}],scheme=schemes[Math.floor(Math.random()*schemes.length)];current.colorB=hslToHex(scheme.hues[0],scheme.sat[0],scheme.light[0]);current.colorC=hslToHex(scheme.hues[1],scheme.sat[1],scheme.light[1]);renderInspector();render(selected);saveSoon();notify(`${scheme.name} 조합을 추천했습니다.`)}
    function screenIndex(id){return screens.findIndex(s=>s.id===id)}
    function groupFor(id){return groups.find(group=>group.screenIds.includes(id))||groups[0]}
    function positionFor(id){let group=groupFor(id);return group?group.screenIds.indexOf(id):-1}
    const designFields=['preset','background','colorA','colorB','colorC','textColor','fontSize','fontWeight','textY','align','imageScale','imageY','frame','dynamicIsland','deviceColor','logoScale','logoX','logoY'];
    function applyDesignPreset(id){let preset=designPresets.find(item=>item.id===id),screen=screens[selected];if(!preset||!screen)return;Object.assign(screen,structuredClone(preset.values),{preset:id});renderInspector();render(selected);saveSoon();notify(`${preset.name} 템플릿을 적용했습니다.`)}

    function bindInspector(){inspector.querySelectorAll('[data-field]').forEach(x=>x.addEventListener(x.type==='checkbox'?'change':'input',e=>{let f=e.target.dataset.field,v=e.target.type==='checkbox'?e.target.checked:e.target.type==='range'?Number(e.target.value):e.target.value;if(f==='title')v=v.replaceAll('\n','\\n');screens[selected][f]=v;if(designFields.includes(f))screens[selected].preset='custom';if(f==='name')renderBoards();else render(selected);if(e.target.type==='range'){let number=inspector.querySelector(`[data-number="${f}"]`),factor=Number(number?.dataset.factor||1);if(number)number.value=factor!==1?Math.round(v/factor):v}saveSoon()}));inspector.querySelectorAll('[data-number]').forEach(x=>x.addEventListener('input',e=>{if(e.target.value===''||e.target.value==='-')return;let f=e.target.dataset.number,factor=Number(e.target.dataset.factor||1),min=Number(e.target.min),max=Number(e.target.max),raw=Number(e.target.value);if(!Number.isFinite(raw))return;raw=Math.max(min,Math.min(max,raw));let v=raw*factor;screens[selected][f]=v;screens[selected].preset='custom';let range=inspector.querySelector(`[data-field="${f}"]`);if(range)range.value=v;render(selected);saveSoon()}));inspector.querySelectorAll('[data-color]').forEach(x=>x.addEventListener('input',e=>{let f=e.target.dataset.color;screens[selected][f]=e.target.value;screens[selected].preset='custom';inspector.querySelector(`[data-field="${f}"]`).value=e.target.value;render(selected);saveSoon()}));inspector.querySelectorAll('[data-preset]').forEach(x=>x.addEventListener('click',e=>applyDesignPreset(e.currentTarget.dataset.preset)));$('#sync-design')?.addEventListener('click',syncDesignAcrossLanguages);upload('image-file','image-drop','imageSrc');upload('logo-file','logo-drop','logoSrc');upload('bg-file','bg-drop','bgImageSrc');$('#left')?.addEventListener('click',()=>move(-1));$('#right')?.addEventListener('click',()=>move(1));$('#duplicate')?.addEventListener('click',duplicate);$('#download')?.addEventListe     function read(file,field){if(!file?.type.startsWith('image/'))return notify('PNG 또는 JPG 이미지를 선택해주세요.');let r=new FileReader;r.onload=()=>{screens[selected][field]=r.result;renderInspector();render(selected);saveSoon()};r.readAsDataURL(file)}
    function select(i){if(!screens[i])return;selected=i;refresh()}
    function move(d){let current=screens[selected],group=current&&groupFor(current.id),pos=current&&group?group.screenIds.indexOf(current.id):-1,target=pos+d;if(pos<0||target<0||target>=group.screenIds.length)return;groups.forEach(g=>{if(g.screenIds[pos]&&g.screenIds[target])[g.screenIds[pos],g.screenIds[target]]=[g.screenIds[target],g.screenIds[pos]]});refresh();saveSoon()}
    function duplicate(){let current=screens[selected],group=current&&groupFor(current.id),pos=current&&group?group.screenIds.indexOf(current.id):-1;if(pos<0||group.screenIds.length>=MAX)return;let selectedGroupId=group.id,newSelectedId='';groups.forEach(g=>{let source=screens[screenIndex(g.screenIds[pos])],clone=make({...structuredClone(source),id:crypto.randomUUID(),name:`${source.name} 복사본`});screens.push(clone);g.screenIds.splice(pos+1,0,clone.id);if(g.id===selectedGroupId)newSelectedId=clone.id});selected=screenIndex(newSelectedId);refresh();saveSoon()}
    function remove(){let current=screens[selected],group=current&&groupFor(current.id),pos=current&&group?group.screenIds.indexOf(current.id):-1;if(pos<0)return;let selectedGroupId=group.id,removed=new Set;groups.forEach(g=>{let[id]=g.screenIds.splice(pos,1);if(id)removed.add(id)});screens=screens.filter(s=>!removed.has(s.id));let nextGroup=groups.find(g=>g.id===selectedGroupId)||groups[0],nextId=nextGroup?.screenIds[Math.min(pos,Math.max(0,nextGroup.screenIds.length-1))];selected=nextId?screenIndex(nextId):0;refresh();saveSoon()}
    function add(){let base=groups[0];if(!base||base.screenIds.length>=MAX)return;let newSelectedId='';groups.forEach((g,index)=>{let item=make();screens.push(item);g.screenIds.push(item.id);if(index===0)newSelectedId=item.id});selected=screenIndex(newSelectedId);refresh();saveSoon()}
    function openLanguageDialog(){languageName.value=`언어 ${groups.length+1}`;languageDialog.classList.add('open');requestAnimationFrame(()=>languageName.select())}
    function closeLanguageDialog(){languageDialog.classList.remove('open')}
    function addLanguage(name){let base=groups[0];if(!base)return;name=name.trim()||`언어 ${groups.length+1}`;let ids=base.screenIds.map(id=>{let source=screens[screenIndex(id)],clone=make({...structuredClone(source),id:crypto.randomUUID()});screens.push(clone);return clone.id});groups.push({id:crypto.randomUUID(),name,screenIds:ids});if(ids.length)selected=screenIndex(ids[0]);closeLanguageDialog();refresh();saveSoon();requestAnimationFrame(()=>boards.scrollTo({top:boards.scrollHeight,behavior:'smooth'}))}
    function removeLanguage(id){let index=groups.findIndex(group=>group.id===id);if(index<=0)return;let [removed]=groups.splice(index,1),removedIds=new Set(removed.screenIds),selectedRemoved=removedIds.has(screens[selected]?.id);screens=screens.filter(screen=>!removedIds.has(screen.id));if(selectedRemoved)selected=screenIndex(groups[Math.min(index-1,groups.length-1)].screenIds[0]);refresh();saveSoon();notify(`${removed.name} 언어를 삭제했습니다.`)}
    function refresh(){renderBoards();renderInspector()}
    const filename=s=>s.trim().replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,'-')||'screenshot';
    function download(i){let s=screens[i],canvas=s&&$(`#c-${s.id}`);if(!canvas)return;let group=groupFor(s.id),pos=group.screenIds.indexOf(s.id);canvas.toBlob(blob=>{if(!blob)return notify('PNG 저장에 실패했습니다.',5000);let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`${filename(group.name)}-${String(pos+1).padStart(2,'0')}-${filename(s.name)}-${size.value}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1200);notify(`${group.name} ${pos+1}번 화면을 저장했습니다.`)},'image/png')}
    async function exportAll(){for(let group of groups){for(let id of group.screenIds){let i=screenIndex(id);if(i>=0){download(i);await new Promise(r=>setTimeout(r,420))}}}}
    function openDB(){return new Promise((ok,no)=>{let req=indexedDB.open(KEY,1);req.onupgradeneeded=()=>req.result.createObjectStore('projects');req.onsuccess=()=>ok(req.result);req.onerror=()=>no(req.error)})}
    async function persist(show=false){try{let db=await openDB(),tx=db.transaction('projects','readwrite');tx.objectStore('projects').put({screens,groups,selected,size:size.value},'current');await new Promise((ok,no)=>{tx.oncomplete=ok;tx.onerror=()=>no(tx.error)});db.close();if(show)notify('모든 언어와 업로드 이미지를 이 브라우저에 저장했습니다.')}catch(e){console.error(e);notify('프로젝트 저장에 실패했습니다. PNG 출력은 사용할 수 있습니다.',6000)}}function saveSoon(){clearTimeout(saveSoon.t);saveSoon.t=setTimeout(()=>persist(),600)}async function restore(){try{let db=await openDB(),tx=db.transaction('projects','readonly'),req=tx.objectStore('projects').get('current'),s=await new Promise((ok,no)=>{req.onsuccess=()=>ok(req.result);req.onerror=()=>no(req.error)});db.close();if(!s?.screens?.length)return;screens=s.screens.map(item=>make({...item,logoSrc:item.logoSrc||''}));let validIds=new Set(screens.map(item=>item.id));groups=s.groups?.length?s.groups.map(group=>({...group,screenIds:group.screenIds.filter(id=>validIds.has(id))})).filter(group=>group.screenIds.length):[{id:crypto.randomUUID(),name:'한국어',screenIds:screens.slice(0,MAX).map(item=>item.id)}];selected=Math.min(s.selected||0,screens.length-1);if(s.size)size.value=s.size}catch(e){console.warn(e)}}
    boards.addEventListener('click',e=>{let languageDelete=e.target.closest('[data-delete-language]');if(languageDelete){e.stopPropagation();removeLanguage(languageDelete.dataset.deleteLanguage);return}let d=e.target.closest('[data-download]');if(d){e.stopPropagation();download(Number(d.dataset.download));return}let s=e.target.closest('[data-select]');if(s)select(Number(s.dataset.select))});$('#add').addEventListener('click',add);$('#add-language').addEventListener('click',openLanguageDialog);$('#cancel-language').addEventListener('click',closeLanguageDialog);$('#language-form').addEventListener('submit',e=>{e.preventDefault();addLanguage(languageName.value)});languageDialog.addEventListener('click',e=>{if(e.target===languageDialog)closeLanguageDialog()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&languageDialog.classList.contains('open'))closeLanguageDialog()});$('#export-all').addEventListener('click',exportAll);$('#save-project').addEventListener('click',()=>persist(true));size.addEventListener('change',()=>{renderAll();saveSoon()});document.fonts.ready.then(()=>restore().finally(refresh));
  </script>
</body>
</html>
